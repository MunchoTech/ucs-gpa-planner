name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Uploads from Windows can drop the executable bit on the Gradle wrapper.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Engine and data tests
        run: ./gradlew :core:test :data:test

      # Optional: to sign release builds with the UCS key, add repository secrets
      # UCS_KEYSTORE_BASE64 (the .jks file, base64-encoded), UCS_KEYSTORE_PASSWORD,
      # UCS_KEY_ALIAS and UCS_KEY_PASSWORD. Without them, release builds use the debug key.
      - name: Prepare release signing key
        env:
          UCS_KEYSTORE_BASE64: ${{ secrets.UCS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UCS_KEYSTORE_BASE64" ]; then
            echo "$UCS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ucs-release.jks"
            echo "UCS_KEYSTORE_FILE=$RUNNER_TEMP/ucs-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        env:
          UCS_KEYSTORE_PASSWORD: ${{ secrets.UCS_KEYSTORE_PASSWORD }}
          UCS_KEY_ALIAS: ${{ secrets.UCS_KEY_ALIAS }}
          UCS_KEY_PASSWORD: ${{ secrets.UCS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: UI tests and screenshots (shared Compose UI on the JVM)
        run: ./gradlew -p tools/desktop-preview :ui-desktop:test

      - uses: actions/upload-artifact@v4
        with:
          name: ucs-gpa-planner-apk
          path: app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/desktop-preview/ui-desktop/build/screenshots/
