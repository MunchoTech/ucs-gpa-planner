name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine and data tests
        run: ./gradlew :core:test :data:test

      - name: Build APKs
        env:
          # Optional: add these as repository secrets to sign release builds with the UCS key.
          UCS_KEYSTORE_FILE: ${{ secrets.UCS_KEYSTORE_FILE }}
          UCS_KEYSTORE_PASSWORD: ${{ secrets.UCS_KEYSTORE_PASSWORD }}
          UCS_KEY_ALIAS: ${{ secrets.UCS_KEY_ALIAS }}
          UCS_KEY_PASSWORD: ${{ secrets.UCS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: UI tests and screenshots (shared Compose UI on the JVM)
        run: ./gradlew -p tools/desktop-preview :ui-desktop:test

      - uses: actions/upload-artifact@v4
        with:
          name: ucs-gpa-planner-apk
          path: app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/desktop-preview/ui-desktop/build/screenshots/
